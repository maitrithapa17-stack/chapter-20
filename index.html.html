.wish{position:absolute;left:50%;top:8%;transform:translate(-50%,-10px) scale(.9);opacity:0;pointer-events:none;text-align:center;transition:.5s;width:92%}
.wish.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.wish h2{margin:0;font:400 calc(var(--pw)*.075)/1.15 'Pacifico',cursive;color:#e5457f;text-shadow:0 2px 0 #fff,0 0 12px #fff,0 0 18px #fff}
#relight{margin-top:.5em;font:inherit;font-size:calc(var(--pw)*.04);border:2px solid #fff;background:#5b9fd3;color:#fff;border-radius:99px;padding:.2em .9em;cursor:pointer}
.back-btn{font:inherit;font-size:20px;border:0;background:#fff8ec;color:var(--ink);padding:.25em 1.1em;border-radius:99px;cursor:pointer;box-shadow:0 3px 8px rgba(70,40,10,.3);opacity:0;pointer-events:none;transition:opacity .4s .5s}
.book.open~.back-btn{opacity:1;pointer-events:auto}
#conf{position:fixed;inset:0;pointer-events:none;z-index:9}
.book.open .front{pointer-events:none}
button:focus-visible{outline:3px solid #2a6fb0;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.book,.cv{transition-duration:.01s}.flame img{animation:none}}
</style>

$('backBtn').addEventListener('click',closeCard);
/* ---------- letter ---------- */
function target(){
 var r=lB.getBoundingClientRect(),k=r.width/1366;
 var w0=565*k,h0=622*k,cx,cy,s;
 if(portrait()){s=Math.min(innerWidth*.88/w0,innerHeight*.78/h0);cx=innerWidth/2;cy=innerHeight/2}
 else{s=.9*r.height/h0;cx=r.left+r.width/2;cy=r.top+r.height/2}
 var lx=r.left+(413+282.5)*k,ly=r.top+(122+311)*k;
 return 'translate('+(cx-lx)+'px,'+(cy-ly)+'px) scale('+s+')';
}
function lift(){
 lifted=true;
 letB.style.transition='none';letB.style.transform='none';lB.style.transition='none';lB.style.opacity=0;
 void lB.offsetWidth;
 lA.style.opacity=0;
 lB.style.transition='opacity .25s';lB.style.opacity=1;
 letB.style.transition='transform .75s cubic-bezier(.3,.1,.2,1)';letB.style.transform=target();
}
function tuck(fast){
 lifted=false;
 letB.style.transition='transform '+(fast?.01:.6)+'s cubic-bezier(.4,0,.2,1)';letB.style.transform='none';
 setTimeout(function(){if(lifted)return;lA.style.opacity=1;lB.style.transition='opacity .2s';lB.style.opacity=0},fast?0:480);
}
document.addEventListener('click',function(e){
 if(!isOpen||!ready)return;
 var r=L.getBoundingClientRect(),inL=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
 if(lifted){tuck();return}
 if(!inL)return;
 var x=(e.clientX-r.left)/r.width*1366,y=(e.clientY-r.top)/r.height*768;
 if(x>395&&x<992&&y>118&&y<430)lift();
});
/* ---------- microphone ---------- */
var an=null,buf=null,micOn=false,base=.012;
function startMic(){
 if(micOn||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('mlabel').textContent='no mic: hold the button or space';return}
 $('mlabel').textContent='allow the mic…';
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(st){
  var AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),src=ac.createMediaStreamSource(st);
  an=ac.createAnalyser();an.fftSize=1024;src.connect(an);buf=new Float32Array(an.fftSize);
  if(ac.state==='suspended')ac.resume();
  micOn=true;$('mlabel').textContent='blow into your mic';
 }).catch(function(){$('mlabel').textContent='mic blocked: hold the button or space'});
}
/* ---------- hold-to-blow fallback ---------- */
var held=false,btn=$('blowBtn');
function hold(v){held=v;btn.classList.toggle('on',v)}
btn.addEventListener('pointerdown',function(e){e.preventDefault();hold(true)});
['pointerup','pointerleave','pointercancel'].forEach(function(n){btn.addEventListener(n,function(){hold(false)})});
document.addEventListener('keydown',function(e){if(e.code==='Space'&&isOpen){e.preventDefault();hold(true)}});
document.addEventListener('keyup',function(e){if(e.code==='Space')hold(false)});
/* ---------- flames ---------- */
var st=flames.map(function(){return{t:0,need:.45+Math.random()*.12,a:0,out:false}});
var allOut=false,last=performance.now();
function frame(now){
 var dt=Math.min(.05,(now-last)/1000);last=now;
 var rms=0,level=0,blowing=false;
 if(an){an.getFloatTimeDomainData(buf);var s=0;for(var i=0;i<buf.length;i++)s+=buf[i]*buf[i];rms=Math.sqrt(s/buf.length);
  blowing=rms>Math.max(.05,base*4);if(!blowing)base=base*.97+rms*.03;level=Math.min(1,rms/.2)}
 if(held){blowing=true;level=Math.max(level,.75)}
 $('lvl').style.width=Math.round(level*100)+'%';
 if(isOpen&&!allOut){
  flames.forEach(function(f,i){var o=st[i];if(o.out)return;
   o.t=blowing?o.t+dt:Math.max(0,o.t-dt*1.5);
   var tgt=blowing?(18+22*Math.min(1,level*1.4))*(.85+.3*((i*37)%10)/10):0;
   o.a+=(tgt-o.a)*.25;
   f.style.transform='rotate('+o.a.toFixed(1)+'deg) scaleY('+(1-o.a/140).toFixed(2)+')';
   if(o.t>=o.need){o.out=true;f.style.transition='opacity .35s,transform .35s';f.style.transform='rotate('+(o.a+10)+'deg) scale(.2,.05)';f.style.opacity=0}
  });
  if(st.every(function(o){return o.out})){allOut=true;setTimeout(function(){$('wish').classList.add('show');confetti()},350)}
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
$('relight').addEventListener('click',function(){
 $('wish').classList.remove('show');allOut=false;
 flames.forEach(function(f,i){st[i]={t:0,need:.45+Math.random()*.12,a:0,out:false};f.style.transition='none';f.style.transform='none';f.style.opacity=1});
});
/* ---------- confetti ---------- */
var cv=$('conf'),cx=cv.getContext('2d'),parts=[],run=false;
function confetti(){
 cv.width=innerWidth;cv.height=innerHeight;
 var cols=['#f06aa4','#6cc0ee','#ffd95a','#ffb3c6','#9bd6a8','#fff'];
 for(var i=0;i<170;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:6+Math.random()*7,h:3+Math.random()*5,c:cols[i%cols.length]});
 if(!run){run=true;requestAnimationFrame(tick)}
}
function tick(){
 cx.clearRect(0,0,cv.width,cv.height);
 parts=parts.filter(function(p){return p.y<cv.height+20});
 parts.forEach(function(p){p.x+=p.vx+Math.sin(p.y/40);p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
 if(parts.length)requestAnimationFrame(tick);else run=false;
}
})();
</script>
